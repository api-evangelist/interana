aid: interana
name: Interana
description: >-
  Interana was an event-based behavioral analytics platform for interactively
  querying large-scale event data (clickstream, product usage, and time-series
  data) at full resolution. Founded around 2013 in Redwood City, California by
  former Facebook engineers, it was used at scale by companies including
  Microsoft Bing. The company's team and technology were acquired by Twitter in
  March 2020; the standalone product was spun out and continued as Scuba
  Analytics (scuba.io), and the interana.com domain now redirects to its
  successor lineage. This API Evangelist profile is retained as a historical /
  defunct company record — there is no live public API surface, developer
  portal, or hosted documentation remaining. The only surviving first-party
  developer surface is the open-source Interana GitHub organization.
